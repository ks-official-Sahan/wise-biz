# Edge for the self-hosted stack (docs/architecture/deployment.md). Cloudflare sits in front in production; these
# rate-limit zones are the second line, not the first.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  # Real client address from the edge proxy only (set_real_ip_from your Cloudflare/LB ranges in production).
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"ms":"$request_time","ua":"$http_user_agent","rid":"$request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  gzip_proxied any;
  # No gzip for text/event-stream: it is never listed above.

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  upstream api { server api:3001; keepalive 32; }
  upstream realtime { server realtime:3002; keepalive 16; }
  upstream console { server console:3000; keepalive 16; }

  # Micro-cache for PUBLIC GETs only (digital receipts). Authenticated API responses are never cached.
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=public:5m max_size=64m inactive=60s use_temp_path=off;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    server_name _;
    location = /nginx-health { access_log off; return 200 "ok"; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 127.0.0.1:8081;
    location = /nginx-health { access_log off; return 200 "ok"; }
  }

  server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    http3 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:10m;
    ssl_session_tickets off;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";

    # Realtime (SSE): no buffering, long read timeout, never compressed.
    location = /v1/stream {
      proxy_pass http://realtime;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      gzip off;
      limit_req zone=api burst=20 nodelay;
    }

    # Sign-in and other credential endpoints: tight limit.
    location ~ ^/v1/auth/ {
      proxy_pass http://api;
      limit_req zone=auth burst=10 nodelay;
    }

    # Public digital receipts: micro-cached (1-5 s), single flight, stale while revalidating.
    location ~ ^/r/ {
      proxy_pass http://api;
      proxy_cache public;
      proxy_cache_valid 200 3s;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout;
      limit_req zone=api burst=40 nodelay;
    }

    location /v1/ {
      proxy_pass http://api;
      proxy_cache off;
      limit_req zone=api burst=60 nodelay;
    }

    location / {
      proxy_pass http://console;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
