packages:
  - "apps/*"
  - "modules/*"
  - "packages/*"
  - "services/*"

linkWorkspacePackages: true

allowBuilds:
  lefthook: true
  unrs-resolver: true
  # Pulled in via testcontainers (docker-modem/ssh2, grpc): optional native crypto addons and a
  # postinstall version check; none is needed to talk to Docker over the local socket.
  cpu-features: false
  protobufjs: false
  ssh2: false

# commitlint 21.2.4 was younger than pnpm's minimumReleaseAge at install (2026-10-19).
# Remove this list once it ages out (after ~2026-10-21).
minimumReleaseAgeExclude:
  - "@commitlint/cli@21.2.4"
  - "@commitlint/config-conventional@21.2.4"
  - "@commitlint/ensure@21.2.4"
  - "@commitlint/lint@21.2.4"
  - "@commitlint/load@21.2.4"
  - "@commitlint/rules@21.2.4"
  - expo-font@58.0.10
  - "@next/env@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - next@16.4.3

auditConfig:
  ignoreGhsas:
    # braces@3.0.3 (no patched release) reached only via @wise-biz/config >
    # @next/eslint-plugin-next > fast-glob: lint-time tooling, never shipped at runtime.
    # Re-check on every Renovate eslint group PR; remove once a patched braces exists.
    - GHSA-vfj7-8cjw-p6xm

# @material/material-color-utilities 0.4.0 imports its own modules without file extensions, which native Node ESM
# cannot resolve (our packages run as TS source on Node, ADR 0008). The patch only appends .js to relative imports;
# regenerate it on upgrade (pnpm patch).
patchedDependencies:
  "@material/material-color-utilities@0.4.0": patches/@material__material-color-utilities@0.4.0.patch
