# Cloudflare Worker in front of the API (docs/architecture/deployment.md). Deploy with `wrangler deploy` from this
# directory once the zone, the API origin and the bindings below exist; nothing here is a secret.
name = "wise-biz-edge"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[vars]
# The API's public https origin (Cloud Run URL or its custom domain). Set per environment.
API_ORIGIN = "https://api.example.invalid"

# Short links: key `s:<code>` holds the target URL. Create the namespace and put its id here.
# [[kv_namespaces]]
# binding = "SHORTLINKS"
# id = "<namespace id>"

# Coarse per-client limit on unsafe /v1 requests. The API keeps its own fail-closed limits behind it.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }
