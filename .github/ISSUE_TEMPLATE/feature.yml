name: Feature request
description: Propose new behavior or a change in scope.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact checks
      options:
        - label: Touches a public contract, event, or API (describe in proposal)
        - label: Needs a database migration
        - label: Needs a new ADR (docs/adr)
