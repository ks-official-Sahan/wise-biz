name: Mobile

# Builds the POS app for Android and iOS with EAS Build and publishes JS-only fixes with EAS Update
# (docs/architecture/deployment.md). Builds run on EAS's machines, so this workflow only starts them (--no-wait) and
# returns; follow them in the Expo dashboard.
#
#   tag v*.*.*          production build (Android AAB, iOS) on the `production` channel
#   manual              staging build (internal distribution), or a staging or production JS update
#
# One-time setup (needs the owner's Expo account, so it is not in the repo):
#   1. `eas init` in apps/pos writes extra.eas.projectId into app.json; commit it.
#   2. In the Expo project, set EXPO_PUBLIC_API_URL (https) and EXPO_PUBLIC_RECEIPT_BASE_URL in the `preview` and
#      `production` environments. The app refuses to sign requests without EXPO_PUBLIC_API_URL.
#   3. GitHub environment `mobile-release`: secret EXPO_TOKEN. iOS signing credentials live in EAS. Limit the environment
#      to master and the v*.*.* tags (deployment branches and tags rule) and require a reviewer for production.
#   4. EAS Update additionally needs `expo-updates` in apps/pos (check its bundle size first) and the repository
#      variable EAS_UPDATES_ENABLED=true; the `update` job is skipped until then.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        type: choice
        options: [build-staging, update-staging, update-production]

permissions: {}

concurrency:
  group: mobile-${{ github.ref }}-${{ inputs.action || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }})
    if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'build-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: mobile-release
    permissions:
      contents: read
    env:
      LEFTHOOK: 0
      PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse a build with no Expo project
        run: |
          grep -q '"projectId"' apps/pos/app.json || { echo "apps/pos/app.json has no extra.eas.projectId (run eas init and commit it)" >&2; exit 1; }

      - name: Refuse a build when the Expo environment has no API URL
        working-directory: apps/pos
        run: |
          if [ "$PROFILE" = production ]; then ENV=production; else ENV=preview; fi
          # shellcheck disable=SC2016 # the inner bash expands the variable, not this shell
          eas env:exec "$ENV" 'test -n "$EXPO_PUBLIC_API_URL" || { echo "EXPO_PUBLIC_API_URL is not set in the Expo environment" >&2; exit 1; }' --non-interactive

      - name: Start the Android and iOS builds
        working-directory: apps/pos
        run: eas build --platform all --profile "$PROFILE" --non-interactive --no-wait

  update:
    name: EAS update (${{ inputs.action == 'update-production' && 'production' || 'staging' }})
    # A production update goes out only from master, so a branch cannot reach production through a manual run.
    if: >-
      startsWith(inputs.action, 'update-') && vars.EAS_UPDATES_ENABLED == 'true' &&
      (inputs.action != 'update-production' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: mobile-release
    permissions:
      contents: read
    env:
      LEFTHOOK: 0
      CHANNEL: ${{ inputs.action == 'update-production' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse an update when expo-updates is not declared
        run: |
          grep -q '"expo-updates"' apps/pos/package.json || { echo "apps/pos/package.json does not declare expo-updates" >&2; exit 1; }

      - name: Publish the update to the channel
        working-directory: apps/pos
        run: |
          if [ "$CHANNEL" = production ]; then ENV=production; else ENV=preview; fi
          # shellcheck disable=SC2016 # the inner bash expands the variable, not this shell
          eas env:exec "$ENV" 'test -n "$EXPO_PUBLIC_API_URL" || { echo "EXPO_PUBLIC_API_URL is not set in the Expo environment" >&2; exit 1; }' --non-interactive
          eas update --channel "$CHANNEL" --environment "$ENV" --message "${GITHUB_SHA::7}" --non-interactive
