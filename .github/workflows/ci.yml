name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint v1.7.12
        run: |
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint

      - name: Run actionlint
        run: ./actionlint -color

  check:
    name: Check (lint, typecheck, test, boundaries)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected diffs against the base branch
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # turbo reads GITHUB_BASE_REF itself on pull_request events.
      - name: Check affected packages (PR)
        if: github.event_name == 'pull_request'
        run: pnpm turbo run check --affected --summarize

      - name: Check all packages (push to master)
        if: github.event_name == 'push'
        run: pnpm turbo run check --summarize

      # Boundary and env tasks run on every change, regardless of affected.
      - name: Boundary and env checks
        run: pnpm turbo run //#depcruise //#env:check //#lint:root

      - name: Format check
        run: pnpm format:check

      - name: Turbo timing summary
        if: always()
        run: node scripts/ci-turbo-summary.mjs >> "$GITHUB_STEP_SUMMARY"

