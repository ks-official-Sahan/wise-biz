name: R2 usage

# Hourly check of Cloudflare R2 usage against the caps in ADR 0023. Fails (so GitHub emails you) when a cap is reached,
# warns at 80%. Other workflows can run the same step before they write to R2.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @wise-biz/storage...
      - name: Check R2 usage
        run: pnpm -F @wise-biz/storage r2-usage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          R2_PERIOD_ANCHOR_DAY: ${{ vars.R2_PERIOD_ANCHOR_DAY }}
          # Must equal the limits the servers run with (their R2_LIMIT_* values); unset = the defaults.
          R2_LIMIT_STORAGE_BYTES: ${{ vars.R2_LIMIT_STORAGE_BYTES }}
          R2_LIMIT_CLASS_A: ${{ vars.R2_LIMIT_CLASS_A }}
          R2_LIMIT_CLASS_B: ${{ vars.R2_LIMIT_CLASS_B }}
